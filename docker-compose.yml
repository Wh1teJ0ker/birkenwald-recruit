services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: birkenwald
      POSTGRES_USER: birkenwald
      POSTGRES_PASSWORD: birkenwald_dev
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U birkenwald -d birkenwald"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  pg_data:
