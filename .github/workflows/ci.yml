name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: birkenwald_test
          POSTGRES_USER: birkenwald
          POSTGRES_PASSWORD: birkenwald_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U birkenwald -d birkenwald_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://birkenwald:birkenwald_test@127.0.0.1:5432/birkenwald_test?sslmode=disable
      TEST_DOCKER_PLUGIN_IMAGE: birkenwald-example:0.1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build example plugin
        run: docker build -f plugins/example/Dockerfile -t "$TEST_DOCKER_PLUGIN_IMAGE" .
      - name: Go tests with race detector
        run: go test -race ./...
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
