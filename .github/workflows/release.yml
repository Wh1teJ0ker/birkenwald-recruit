name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: birkenwald_test
          POSTGRES_USER: birkenwald
          POSTGRES_PASSWORD: birkenwald_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U birkenwald -d birkenwald_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      CGO_ENABLED: "1"
      GOOS: linux
      GOARCH: amd64
      GOTOOLCHAIN: local
      TEST_DATABASE_URL: postgres://birkenwald:birkenwald_test@127.0.0.1:5432/birkenwald_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify release version and tag
        run: ./scripts/check-version.sh
      - name: Test release candidate
        run: |
          go test -race ./...
          cd frontend
          npm ci
          npm test
          npm run build
      - name: Build Linux release artifacts
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          name="birkenwald-recruit-v${version}-linux-amd64"
          stage="release/${name}"
          mkdir -p "$stage/plugins/example" "$stage/frontend" "$stage/pluginapi" dist
          go build -trimpath -ldflags "-s -w" -o "$stage/api" ./cmd/api
          go build -trimpath -ldflags "-s -w" -o "$stage/worker" ./cmd/worker
          go build -buildmode=plugin -trimpath -o "$stage/plugins/example/example.so" ./plugins/example
          cp -R frontend/dist "$stage/frontend/dist"
          cp README.md AGENT.md VERSION .env.example "$stage/"
          cp pluginapi/pluginapi.go "$stage/pluginapi/"
          cp plugins/example/main.go plugins/example/README.md plugins/example/AGENTS.md "$stage/plugins/example/"
          touch -r "$stage/plugins/example/example.so" "$stage/plugins/example/main.go" "$stage/plugins/example/README.md" "$stage/plugins/example/AGENTS.md"
          cat > "$stage/go.mod" <<EOF
          module github.com/Wh1teJ0ker/birkenwald-recruit

          go $(go list -m -f '{{.GoVersion}}')
          EOF
          tar -C release -czf "dist/${name}.tar.gz" "$name"
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.gz dist/SHA256SUMS --clobber
            gh release edit "$tag" --draft=false
          else
            gh release create "$tag" dist/*.tar.gz dist/SHA256SUMS \
              --title "Birkenwald Recruit $tag" \
              --generate-notes \
              --latest
          fi
